name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.1)"
        required: true
        default: "v1.0.1"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            os_name: linux
            suffix: ""
          - goos: linux
            goarch: arm64
            os_name: linux
            suffix: ""
          - goos: darwin
            goarch: amd64
            os_name: macos
            suffix: ""
          - goos: darwin
            goarch: arm64
            os_name: macos
            suffix: ""
          - goos: windows
            goarch: amd64
            os_name: windows
            suffix: ".exe"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      # A re-dispatch for an already-released tag must rebuild from that tag,
      # not from whatever main has moved on to.
      - name: Prefer the release tag when it already exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          tag="${{ inputs.tag_name }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Building from existing tag $tag"
            git checkout --detach "refs/tags/$tag"
          else
            echo "Tag $tag does not exist yet; building from main"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set version
        id: ver
        run: echo "tag=${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=${{ steps.ver.outputs.tag }}" \
            -o httpmon-${{ steps.ver.outputs.tag }}-${{ matrix.os_name }}-${{ matrix.goarch }}${{ matrix.suffix }} .

      - uses: actions/upload-artifact@v4
        with:
          name: httpmon-${{ matrix.os_name }}-${{ matrix.goarch }}
          path: httpmon-${{ steps.ver.outputs.tag }}-${{ matrix.os_name }}-${{ matrix.goarch }}${{ matrix.suffix }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Auto-generated notes only summarise merged PRs, so a release whose work
      # landed outside a PR ends up with notes that omit everything — including
      # breaking changes. Prefer the hand-written CHANGELOG section.
      - name: Build release notes from CHANGELOG
        id: notes
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}"
          version="${tag#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/        { exit }
            found                    { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ -s RELEASE_NOTES.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using the CHANGELOG section for $version:"
            cat RELEASE_NOTES.md
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No CHANGELOG section for $version; falling back to generated notes."
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md).\n' \
              "$GITHUB_REPOSITORY" > RELEASE_NOTES.md
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          files: dist/*
          body_path: RELEASE_NOTES.md
          # Only append the PR summary when there is no CHANGELOG section to use.
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
