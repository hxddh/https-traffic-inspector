name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v5.0.0)"
        required: true
        default: "v5.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            os_name: linux
            suffix: ""
          - goos: linux
            goarch: arm64
            os_name: linux
            suffix: ""
          - goos: darwin
            goarch: amd64
            os_name: macos
            suffix: ""
          - goos: darwin
            goarch: arm64
            os_name: macos
            suffix: ""
          - goos: windows
            goarch: amd64
            os_name: windows
            suffix: ".exe"
          - goos: windows
            goarch: arm64
            os_name: windows
            suffix: ".exe"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      # A re-dispatch for an already-released tag must rebuild from that tag,
      # not from whatever main has moved on to.
      - name: Prefer the release tag when it already exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          tag="${{ inputs.tag_name }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Building from existing tag $tag"
            git checkout --detach "refs/tags/$tag"
          else
            echo "Tag $tag does not exist yet; building from main"
          fi

      - uses: actions/setup-go@v5
        with:
          # The newest 1.26 patch release, not go.mod's minimum: release
          # binaries embed the standard library's TLS and HTTP code, so they
          # should carry its latest security fixes.
          go-version: "1.26.x"
          check-latest: true
          cache: true

      - name: Set version
        id: ver
        run: echo "tag=${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          # Asset names carry no version, so install scripts and docs can
          # use /releases/latest/download/<name>.
          go build -trimpath -ldflags="-s -w -X main.version=${{ steps.ver.outputs.tag }}" \
            -o httpmon-${{ matrix.os_name }}-${{ matrix.goarch }}${{ matrix.suffix }} ./cmd/httpmon

      - uses: actions/upload-artifact@v4
        with:
          name: httpmon-${{ matrix.os_name }}-${{ matrix.goarch }}
          path: httpmon-${{ matrix.os_name }}-${{ matrix.goarch }}${{ matrix.suffix }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # build provenance attestations
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Prefer the release tag when it already exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          tag="${{ inputs.tag_name }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git checkout --detach "refs/tags/$tag"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true

      # A software bill of materials for the module's dependencies.
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/httpmon.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        run: |
          cp install.sh install.ps1 dist/
          cd dist
          sha256sum httpmon-* httpmon.spdx.json install.sh install.ps1 > SHA256SUMS
          cat SHA256SUMS

      # Verify with: gh attestation verify httpmon-linux-amd64 --repo OWNER/REPO
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/httpmon-*"

      # Auto-generated notes only summarise merged PRs, so a release whose work
      # landed outside a PR ends up with notes that omit everything — including
      # breaking changes. Prefer the hand-written CHANGELOG section.
      - name: Build release notes from CHANGELOG
        id: notes
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}"
          version="${tag#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/        { exit }
            found                    { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ -s RELEASE_NOTES.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using the CHANGELOG section for $version:"
            cat RELEASE_NOTES.md
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No CHANGELOG section for $version; falling back to generated notes."
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md).\n' \
              "$GITHUB_REPOSITORY" > RELEASE_NOTES.md
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          files: dist/*
          body_path: RELEASE_NOTES.md
          # Only append the PR summary when there is no CHANGELOG section to use.
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}

  container:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - name: Prefer the release tag when it already exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          tag="${{ inputs.tag_name }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git checkout --detach "refs/tags/$tag"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Image name
        id: img
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image holds the release binaries built above, not a second build.
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.img.outputs.tag }}
            ${{ steps.img.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.img.outputs.tag }}
            org.opencontainers.image.licenses=MIT
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
