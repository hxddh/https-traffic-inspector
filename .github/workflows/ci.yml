name: CI

on:
  push:
    # Branches with a pull request are tested by its pull_request runs; a
    # push run as well would test the same commit twice.
    branches: ["main"]
  pull_request:
    branches: ["main"]

# A newer push to the same branch or pull request supersedes a run still
# waiting or in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The newest 1.26 patch release, not go.mod's minimum: release
          # binaries embed the standard library's TLS and HTTP code, so they
          # should carry its latest security fixes.
          go-version: "1.26.x"
          check-latest: true
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 -timeout 300s "-coverprofile=coverage.out" ./...
      - name: Coverage summary
        if: runner.os == 'Linux'
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: coverage
          path: coverage.out

  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true
      - name: Performance budget
        env:
          HTTPMON_PERF: "1"
        run: go test -count=1 -run TestPerfBudget -v ./cmd/httpmon

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true
      # A short run on every change; the nightly workflow runs longer.
      - name: Fuzz
        run: |
          go test ./internal/body -run '^$' -fuzz '^FuzzRender$' -fuzztime 20s
          go test ./internal/body -run '^$' -fuzz '^FuzzDecodeProtobuf$' -fuzztime 20s
          go test ./internal/rules -run '^$' -fuzz '^FuzzParse$' -fuzztime 20s
          go test ./internal/textsafe -run '^$' -fuzz '^FuzzLine$' -fuzztime 20s

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true
      - name: install.sh against a local mirror
        run: |
          mkdir -p mirror
          CGO_ENABLED=0 go build -o mirror/httpmon-linux-amd64 ./cmd/httpmon
          (cd mirror && sha256sum httpmon-linux-amd64 > SHA256SUMS)
          (cd mirror && python3 -m http.server 18300 &) && sleep 1
          HTTPMON_DOWNLOAD_BASE=http://127.0.0.1:18300 HTTPMON_INSTALL_DIR="$PWD/bin" sh install.sh
          ./bin/httpmon --version
      - name: Container image builds
        run: |
          mkdir -p dist && cp mirror/httpmon-linux-amd64 dist/
          docker build --build-arg TARGETARCH=amd64 -t httpmon:ci .
          docker run --rm httpmon:ci --version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The newest 1.26 patch release, not go.mod's minimum: release
          # binaries embed the standard library's TLS and HTTP code, so they
          # should carry its latest security fixes.
          go-version: "1.26.x"
          check-latest: true
          cache: true
      # golangci-lint v2 requires action v7; v6 rejects a v2.x version string.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          # `config verify` downloads a JSON schema from golangci-lint.run on
          # every run, so a slow fetch fails the job for reasons unrelated to
          # the code. The config is validated by the lint run itself.
          verify: false
