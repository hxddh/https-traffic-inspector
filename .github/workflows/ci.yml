name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 -timeout 300s -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # golangci-lint v2 requires action v7; v6 rejects a v2.x version string.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.0
          # `config verify` downloads a JSON schema from golangci-lint.run on
          # every run, so a slow fetch fails the job for reasons unrelated to
          # the code. The config is validated by the lint run itself.
          verify: false
